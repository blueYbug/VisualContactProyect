<ion-header>
  <ion-toolbar>
    <ion-title>Iniciar Sesión</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <form (ngSubmit)="onLogin()">
    <ion-item>
      <ion-label position="floating">Correo electrónico</ion-label>
      <ion-input type="email" [(ngModel)]="email" name="email" required></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Contraseña</ion-label>
      <ion-input type="password" [(ngModel)]="password" name="password" required></ion-input>
    </ion-item>

    <div class="ion-text-center ion-margin-top">
      <ion-button type="submit" expand="block">Ingresar</ion-button>
    </div>

  

    <div class="ion-text-center ion-margin-top">
      <p>¿No tienes cuenta?</p>
      <ion-button fill="clear" routerLink="/register">Crear cuenta</ion-button>
    </div>

  </form>

</ion-content>
