<ion-header collapse="condense">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/"></ion-back-button>
    </ion-buttons>
    <ion-title size="large">{{ contact.name }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [scrollEvents]="true" (ionScroll)="onScroll($event)" style="--background: #000; color: #fff; padding-bottom: 140px;">

  <!-- Avatar y nombre -->
  <div class="contact-header" [ngStyle]="{'transform': 'scale(' + avatarScale + ')'}">
    <ion-avatar>
      <img src="https://via.placeholder.com/150" alt="Foto del contacto" />
    </ion-avatar>
    <h2>{{ contact.name }}</h2>
    <p>{{ contact.phone }}</p>
  </div>

  <!-- Botones principales -->
  <ion-grid>
    <ion-row class="ion-justify-content-center ion-margin-bottom">
      <ion-col size="4" class="ion-text-center">
        <ion-button expand="full" color="success" (click)="goToLlamada()">
          <ion-icon slot="start" name="call-outline"></ion-icon>
          Llamar
        </ion-button>
      </ion-col>
      <ion-col size="4" class="ion-text-center">
        <ion-button expand="full" color="tertiary" (click)="goToChat()">
          <ion-icon slot="start" name="chatbubbles-outline"></ion-icon>
          Mensaje
        </ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>

  <!-- Registro de llamadas y mensajes -->
  <ion-card>
    <ion-card-header>
      <ion-card-title>Registro de llamadas</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-list lines="none">
        <ion-item *ngFor="let call of visibleCallLog" class="call-item">
          <ion-icon slot="start" [name]="call.icon" [color]="call.color" class="call-icon"></ion-icon>
          <div class="call-text">{{ call.text }}</div>
        </ion-item>
      </ion-list>
      <ion-infinite-scroll threshold="100px" (ionInfinite)="loadMore($event)">
        <ion-infinite-scroll-content
          loadingSpinner="bubbles"
          loadingText="Cargando más registros...">
        </ion-infinite-scroll-content>
      </ion-infinite-scroll>
    </ion-card-content>
  </ion-card>

  <!-- Botones flotantes -->
  <div class="floating-buttons">
    <!-- Favorito -->
    <ion-button fill="clear" class="favorite-btn" (click)="toggleFavorite()" [class.filled]="isFavorite">
      <ion-icon [name]="isFavorite ? 'heart' : 'heart-outline'" color="danger"></ion-icon>
    </ion-button>

    <!-- Editar -->
    <ion-button fill="clear" class="edit-btn" (click)="editContact()">
      <ion-icon name="create-outline"></ion-icon>
    </ion-button>

    <!-- QR -->
    <ion-button fill="clear" class="share-btn" (click)="showQR = true">
      <ion-icon name="qr-code-outline"></ion-icon>
    </ion-button>

    <!-- Modal QR -->
    <ion-modal [isOpen]="showQR" backdropDismiss="true" (didDismiss)="showQR = false">
  <ion-content class="qr-modal-content">
    <div class="qr-container">
      <img *ngIf="qrImageUrl" [src]="qrImageUrl" alt="QR del contacto" />
      <ion-button expand="block" color="light" (click)="showQR = false" class="close-qr-btn">
        Cerrar
      </ion-button>
    </div>
  </ion-content>
</ion-modal>


    <!-- Más opciones -->
    <ion-button fill="clear" class="more-btn" (click)="moreOptions()">
      <ion-icon name="ellipsis-horizontal-outline"></ion-icon>
    </ion-button>
  </div>

  <!-- Menú Más funcional -->
<ion-action-sheet
  [isOpen]="showMoreOptions"
  (didDismiss)="showMoreOptions = false"
  header="Opciones"
  [buttons]="buttons">
</ion-action-sheet>


</ion-content>
