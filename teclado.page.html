<ion-header>
  <ion-toolbar>
    <ion-title>Teclado</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="teclado-page">

  <!-- Pantalla que muestra el número ingresado -->
  <div class="display-number">
    <h2>{{ phoneNumber || ' ' }}</h2>
  </div>

  <!-- Contenedor absoluto del teclado + botones de acción -->
  <div class="teclado-container">

    <!-- Teclado numérico -->
    <div class="keypad">
      <div class="key-row">
        <button (click)="addNumber('1')">1</button>
        <button (click)="addNumber('2')">2</button>
        <button (click)="addNumber('3')">3</button>
      </div>
      <div class="key-row">
        <button (click)="addNumber('4')">4</button>
        <button (click)="addNumber('5')">5</button>
        <button (click)="addNumber('6')">6</button>
      </div>
      <div class="key-row">
        <button (click)="addNumber('7')">7</button>
        <button (click)="addNumber('8')">8</button>
        <button (click)="addNumber('9')">9</button>
      </div>
      <div class="key-row">
        <button (click)="addNumber('*')">*</button>
        <button (click)="addNumber('0')">0</button>
        <button (click)="addNumber('#')">#</button>
      </div>
    </div>

    <!-- Botones de acción: llamar centrado y borrar a la derecha -->
    <div class="action-row">
      <button class="call-btn" (click)="makeCall()">
        <ion-icon name="call-outline"></ion-icon>
      </button>

      <button class="delete-btn" (click)="deleteNumber()">
        <ion-icon name="backspace-outline"></ion-icon>
      </button>
    </div>

  </div>

</ion-content>

<!-- ==============================
     Barra de navegación inferior
     ============================== -->
<ion-footer>
  <ion-toolbar>
    <ion-grid>
      <ion-row class="ion-justify-content-space-around ion-align-items-center">
        <ion-col class="ion-text-center">
          <ion-button fill="clear" [routerLink]="['/teclado']" class="active">
            <ion-icon name="keypad-outline"></ion-icon>
          </ion-button>
        </ion-col>
        <ion-col class="ion-text-center">
          <ion-button fill="clear" [routerLink]="['/recientes']">
            <ion-icon name="time-outline"></ion-icon>
          </ion-button>
        </ion-col>
        <ion-col class="ion-text-center">
          <ion-button fill="clear" [routerLink]="['/home']">
            <ion-icon name="people-outline"></ion-icon>
          </ion-button>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-toolbar>
</ion-footer>
